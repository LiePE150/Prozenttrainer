(function(root){
'use strict';
const topics=[
 {id:'mix',code:'↗',name:'Alles gemischt',short:'Gemischte Runde',description:'Alle fünf Themen in einer Runde.'},
 {id:'G',code:'G',name:'Grundwert',short:'Grundwert',description:'Berechne das Ganze: 100 %.'},
 {id:'W',code:'W',name:'Prozentwert',short:'Prozentwert',description:'Berechne den Anteil am Ganzen.'},
 {id:'p',code:'p %',name:'Prozentsatz',short:'Prozentsatz',description:'Berechne den Anteil in Prozent.'},
 {id:'decrease',code:'− %',name:'Verminderter Grundwert',short:'Verminderter Grundwert',description:'Rabatte und ursprüngliche Preise.'},
 {id:'increase',code:'+ %',name:'Vermehrter Grundwert',short:'Vermehrter Grundwert',description:'Aufschläge und ursprüngliche Preise.'}
];
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=(n,d=2)=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:2,useGrouping:true}).format(n);
const num=n=>fmt(n,0);
const euro=n=>fmt(n)+' €';
const pick=(a,rng)=>a[Math.floor(rng()*a.length)];
function shuffle(a,rng=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generate(topic,variant=0,rng=Math.random){
 const G=pick([40,48,60,64,80,96,100,120,160,200,240,250,320,400,480,600,800],rng);
 const p=pick([5,10,12.5,15,20,25,30,40,50,60,75,80],rng);
 const W=round(G*p/100);
 const item=pick(['Ein Rucksack','Ein Fahrradhelm','Ein Paar Kopfhörer','Eine Jacke','Ein Paar Sportschuhe'],rng);
 let q={topic,G,p,W,unit:'€',answer:0,given:[],steps:[],hint:'',label:'Dein Ergebnis',prompt:'',variant};
 if(topic==='W'){
  q.prompt=`Für ein Schulfest stehen ${euro(G)} bereit. ${num(p)} % davon sind für Getränke geplant. Berechne den Betrag für Getränke.`;
  q.answer=W;q.given=[`Grundwert G = ${euro(G)}`,`Prozentsatz p = ${num(p)} %`];q.label='Prozentwert W';
  q.hint='Das Ganze entspricht 100 %. Teile den Grundwert durch 100 und multipliziere mit dem Prozentsatz.';
  q.steps=[`W = G : 100 · p`,`W = ${num(G)} : 100 · ${num(p)} = ${euro(W)}`];
 }else if(topic==='G'){
  q.prompt=`Für Getränke werden ${euro(W)} eingeplant. Das sind ${num(p)} % des gesamten Budgets. Berechne das gesamte Budget.`;

 }else if(topic==='p'){

  q.hint='Vergleiche den Anteil mit dem Ganzen: Teile den Prozentwert durch den Grundwert und multipliziere mit 100.';
  q.steps=[`p = W : G · 100`,`p = ${num(W)} : ${num(G)} · 100 = ${num(p)} %`];
 }else{
  const sign=topic==='decrease'?-1:1;

  const changed=round(G*(100+sign*rate)/100);
  const change=round(G*rate/100);q.p=rate;q.W=change;q.changed=changed;
  if(topic==='decrease'&&variant%2===0){
   q.prompt=`${item} kostet ${euro(G)}. Im Angebot gibt es ${num(rate)} % Rabatt. Berechne den neuen Preis.`;
   q.answer=changed;q.label='Neuer Preis (verminderter Grundwert)';q.given=[`Alter Preis = ${euro(G)}`,`Rabatt = ${num(rate)} %`];
   q.hint=`Nach ${num(rate)} % Rabatt bleiben ${num(100-rate)} % des ursprünglichen Preises übrig. Berechne diesen Anteil.`;
   q.steps=[`Neuer Anteil: 100 % − ${num(rate)} % = ${num(100-rate)} %`,`Neuer Preis = ${num(G)} : 100 · ${num(100-rate)} = ${euro(changed)}`];
  }else if(topic==='decrease'){
   q.prompt=`${item} kostet nach ${num(rate)} % Rabatt noch ${euro(changed)}. Berechne den ursprünglichen Preis.`;
   q.answer=G;q.label='Ursprünglicher Preis (Grundwert G)';q.given=[`Neuer Preis = ${euro(changed)}`,`Rabatt = ${num(rate)} %`];
   q.hint=`Der neue Preis entspricht ${num(100-rate)} %, der ursprüngliche Preis 100 %. Rechne vom neuen Preis auf 1 % und dann auf 100 %.`;
   q.steps=[`${euro(changed)} entsprechen 100 % − ${num(rate)} % = ${num(100-rate)} %`,`Ursprünglicher Preis = ${num(changed)} : ${num(100-rate)} · 100 = ${euro(G)}`];
  }else if(variant%2===0){
   q.prompt=`Ein Monatsticket kostet ${euro(G)}. Der Preis steigt um ${num(rate)} %. Berechne den neuen Preis.`;
   q.answer=changed;q.label='Neuer Preis (vermehrter Grundwert)';q.given=[`Alter Preis = ${euro(G)}`,`Preiserhöhung = ${num(rate)} %`];
   q.hint=`Nach der Erhöhung entspricht der neue Preis ${num(100+rate)} % des ursprünglichen Preises. Berechne diesen Anteil.`;
   q.steps=[`Neuer Anteil: 100 % + ${num(rate)} % = ${num(100+rate)} %`,`Neuer Preis = ${num(G)} : 100 · ${num(100+rate)} = ${euro(changed)}`];
  }else{
   q.prompt=`Nach einer Preiserhöhung um ${num(rate)} % kostet ein Monatsticket ${euro(changed)}. Berechne den ursprünglichen Preis.`;
   q.answer=G;q.label='Ursprünglicher Preis (Grundwert G)';q.given=[`Neuer Preis = ${euro(changed)}`,`Preiserhöhung = ${num(rate)} %`];
   q.hint=`Der neue Preis entspricht ${num(100+rate)} %, der ursprüngliche Preis 100 %. Teile den neuen Preis durch ${num(100+rate)} und multipliziere mit 100.`;
   q.steps=[`${euro(changed)} entsprechen 100 % + ${num(rate)} % = ${num(100+rate)} %`,`Ursprünglicher Preis = ${num(changed)} : ${num(100+rate)} · 100 = ${euro(G)}`];
  }
 }
 q.answer=round(q.answer);return q;
}
function createRound(mode,count=10,rng=Math.random){
 if(!topics.some(x=>x.id===mode)||![5,10,15].includes(count))throw Error('Ungültige Runde');
 const categories=topics.slice(1).map(x=>x.id),list=[];
 if(mode==='mix'){const offsets=Object.fromEntries(categories.map(t=>[t,Math.floor(rng()*2)]));for(let n=0;n<count/5;n++){for(const t of categories)list.push(generate(t,n+offsets[t],rng));}}
 else for(let i=0;i<count;i++)list.push(generate(mode,i,rng));
 return {id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random(),mode,count,questions:shuffle(list,rng),index:0,results:[],attempts:0,hinted:false,draft:'',startedAt:Date.now()};
}
function parseNumber(text,unit){
 let s=String(text).trim().replace(/\s/g,'');
 const suffix=s.match(/(€|%|euro|eur)$/i);
 if(suffix){const u=suffix[0]==='%'?'%':'€';if(unit&&u!==unit)return null;s=s.slice(0,-suffix[0].length);}
 if(s.includes(',')){if(!/^-?(?:\d{1,3}(?:\.\d{3})+|\d*),\d+$/.test(s))return null;s=s.replace(/\./g,'').replace(',','.');}

}
const api={topics,round,fmt,num,euro,shuffle,generate,createRound,parseNumber,isCorrect,score,summarize};
if(typeof module!=='undefined'&&module.exports)module.exports=api;
root.PercentEngine=api;
})(typeof globalThis!=='undefined'?globalThis:this);

'use strict';

function statsHTML(s){return `<div class="stats-row"><div class="stat"><div class="stat-icon">${svg('chart')}</div><div><b>${E.num(s.count)}</b><span>Aufgaben geübt</span></div></div><div class="stat"><div class="stat-icon">${svg('check')}</div><div><b>${s.count?s.rate+' %':'–'}</b><span>Richtig gelöst</span></div></div><div class="stat"><div class="stat-icon orange">${svg('spark')}</div><div><b>${E.num(s.points)}</b><span>Deine Punkte</span></div></div></div>`;}
function home(){const s=E.summarize(state.rounds);return `${storageWarning()}${state.current?`<div class="resume-banner"><div><strong>Deine Runde wartet auf dich.</strong><p>${topic(state.current.mode).name} · ${state.current.results.length} von ${state.current.count} Aufgaben bearbeitet</p></div><a class="secondary" href="#runde">Fortsetzen ${svg('arrow')}</a></div>`:''}<section class="hero"><div><div class="eyebrow">DEIN PROZENTRECHNUNGS-TRAINER</div><h1>Prozente?<br><span>Kannst du.</span></h1><p>Ein bisschen üben. Viel sicherer werden.<br>Wähle dein Thema und leg los.</p></div><div class="percent-art" role="img" aria-label="25 von 100 Kästchen sind eingefärbt: 25 Prozent"><div class="tile-grid">${'<i></i>'.repeat(100)}</div><div class="percent-sticker">25 %</div></div></section>${statsHTML(s)}<section aria-labelledby="topic-heading"><div class="section-heading"><h2 id="topic-heading">Was möchtest du üben?</h2><p>Du bestimmst den Fokus.</p></div><div class="topic-grid" role="group" aria-label="Thema auswählen">${E.topics.map(t=>`<button type="button" class="topic ${state.prefs.mode===t.id?'selected':''}" data-action="topic" data-topic="${t.id}" aria-pressed="${state.prefs.mode===t.id}"><div class="topic-code"><span class="code">${t.code}</span><span class="radio" aria-hidden="true"></span></div><h3>${t.name}</h3><p>${t.description}</p></button>`).join('')}</div><div class="start-panel"><div class="round-choice"><label>Aufgaben pro Runde</label><div class="segments" role="group" aria-label="Anzahl der Aufgaben">${[5,10,15].map(n=>`<button data-action="count" data-count="${n}" class="${state.prefs.count===n?'active':''}" aria-pressed="${state.prefs.count===n}">${n}</button>`).join('')}</div></div><button class="primary" data-action="start">Training starten ${svg('arrow')}</button></div><div class="session-note"><span>${svg('clock')} Ohne Zeitlimit</span><span>2 Punkte direkt · 1 mit Tipp oder zweitem Versuch</span></div></section>`;}
function questionPage(){const r=state.current;if(!r)return home();const q=r.questions[r.index];const result=r.results[r.index];const finished=!!result;const last=r.index===r.count-1;
let fb='';
if(result){let title=result.correct?(result.points===2?'Stimmt. Sicher gerechnet! +2 Punkte':'Richtig gelöst! +1 Punkt'):(result.skipped?'Schau dir den Rechenweg an.':'Noch nicht richtig. Das üben wir weiter.');fb=`<section class="feedback ${result.correct?'':'neutral'}" role="status" aria-live="polite"><h2>${title}</h2><p>Das Ergebnis ist <strong>${value(q)}</strong>.</p><div class="solution-lines">${q.steps.map(x=>`<div>${esc(x)}</div>`).join('')}</div>${!result.correct?'<p>Für diese Aufgabe gibt es 0 Punkte. Beim nächsten Mal klappt es besser.</p>':''}</section><div class="next-row"><small>In Ruhe nachvollziehen,<br>dann weiter.</small><button class="primary" id="next-btn" data-action="next">${last?'Zur Auswertung':'Nächste Aufgabe'} ${svg('arrow')}</button></div>`;
}else if(r.attempts>0){fb=`<section class="feedback bad" role="status" aria-live="polite"><h2>Noch nicht ganz. Du hast einen zweiten Versuch.</h2><p>${q.topic==='G'||q.variant%2===1&&(q.topic==='increase'||q.topic==='decrease')?'Überlege: Welcher Wert entspricht 100 %?':'Prüfe deinen Rechenweg und deine Eingabe.'} Du kannst dir auch einen Tipp holen.</p></section>`;}
return `${storageWarning()}<div class="exercise-wrap"><div class="round-header"><span class="round-label">${topic(r.mode).name} · Aufgabe ${r.index+1} / ${r.count}</span><button class="text-button" data-action="pause">Runde pausieren</button></div><div class="progress" aria-label="Aufgabe ${r.index+1} von ${r.count}">${r.questions.map((_,i)=>`<span class="${r.results[i]?(r.results[i].correct?'correct':'wrong'):i===r.index?'current':''}"></span>`).join('')}</div><section class="question-card"><div class="question-top"><span class="pill">${topic(q.topic).short}</span><span class="points">${finished?result.points+' von 2 Punkten':r.hinted||r.attempts?'Noch 1 Punkt möglich':'2 Punkte möglich'}</span></div><h1>${esc(q.prompt)}</h1><div class="given">${q.given.map(x=>`<span>${esc(x)}</span>`).join('')}</div><form id="answer-form" novalidate><label class="answer-label" for="answer">${esc(q.label)}</label><div class="input-group ${finished?(result.correct?'success':''):inputError?'error':''}"><input id="answer" name="answer" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0" value="${esc(r.draft||'')}" ${finished?'disabled':''} aria-describedby="input-help${inputError?' answer-error':''}" ${inputError?'aria-invalid="true"':''}><span class="unit">${q.unit}</span></div><p id="input-help" class="input-help">Komma oder Punkt möglich. Falls nötig: auf 2 Nachkommastellen runden.</p>${inputError?`<p id="answer-error" class="answer-error" role="alert">${esc(inputError)}</p>`:''}${!finished?`<div class="question-actions"><button type="button" class="hint-button" data-action="hint" aria-expanded="${r.hinted}">${svg('bulb')}${r.hinted?'Tipp eingeblendet':'Tipp anzeigen · danach max. 1 Punkt'}</button><button class="primary" type="submit">Antwort prüfen ${svg('check')}</button></div>`:''}</form>${r.hinted?`<div class="hint-box"><strong>Dein Denkanstoß</strong><br>${esc(q.hint)}</div>`:''}</section>${fb}${!finished?'<div style="text-align:right;margin-top:8px"><button class="text-button" data-action="skip">Lösung ansehen · 0 Punkte</button></div>':''}<div class="round-score"><span><strong>${r.results.reduce((a,x)=>a+x.points,0)}</strong> Punkte in dieser Runde</span><span><strong>${r.results.filter(x=>x.correct).length}</strong> richtig gelöst</span></div></div>`;}
function topicTable(s){return `<div class="table-scroll"><table><thead><tr><th>Thema</th><th>Richtig gelöst</th><th>Punkte</th><th>Dein Stand</th></tr></thead><tbody>${s.byTopic.map(t=>`<tr><td><strong>${t.short}</strong></td><td>${t.total?t.correct+' / '+t.total:'–'}${t.total?`<span class="bar" aria-hidden="true"><i style="width:${t.correct/t.total*100}%"></i></span>`:''}</td><td>${t.total?t.points+' / '+2*t.total:'–'}</td><td>${!t.total?'<span class="muted">Noch offen</span>':t.firstTry/t.total>=.8?'<span class="mini-pill">Sicher</span>':t.correct/t.total>=.6?'<span class="mini-pill">Dranbleiben</span>':'<span class="mini-pill orange">Weiter üben</span>'}</td></tr>`).join('')}</tbody></table></div><p class="privacy-note">„Sicher“: mindestens 80 % direkt ohne Tipp gelöst. „Dranbleiben“: mindestens 60 % insgesamt richtig. Mit Tipp oder im zweiten Versuch gelöste Aufgaben zählen als richtig.</p>`;}

function resultPage(id){const r=state.rounds.find(x=>x.id===id)||state.rounds[state.rounds.length-1];if(!r)return emptyStats();const s=E.summarize([r]);const title=s.rate===100?'Alles richtig. Stark!':s.rate>=60?'Du kommst voran.':'Jeder Versuch zählt.';return `<section class="result-hero"><div><div class="eyebrow">DEINE RUNDE IST GESCHAFFT</div><h1>${title}</h1><p>${s.correct} von ${r.count} Aufgaben richtig gelöst.<br>${s.firstTry} davon direkt ohne Tipp.</p></div><div class="result-badge"><strong>${s.points} / ${r.count*2}</strong><span>Punkte</span></div></section><div class="result-actions"><button class="primary" data-action="again" data-topic="${r.mode}" data-count="${r.count}">Noch eine Runde ${svg('arrow')}</button><a class="secondary" href="#training">Thema auswählen</a></div><section class="panel"><h2>Deine Themen im Überblick</h2>${topicTable(s)}</section>${recommendation(s)}<section style="margin-top:27px"><div class="section-heading"><h2>Deine Rechenwege</h2><p>Antippen und nachvollziehen.</p></div><div class="review">${r.results.map((x,i)=>`<details><summary>${x.correct?'✓':'↻'} Aufgabe ${i+1} · ${topic(x.question.topic).short} <span class="muted">· ${x.points} / 2 Punkte</span></summary><div class="details-content"><p>${esc(x.question.prompt)}</p><p style="margin-top:10px">Deine Eingabe: <strong>${x.skipped?'Lösung angesehen':esc(x.input||'–')}</strong>${x.hinted?' · mit Tipp':''}${x.attempts?' · zweiter Versuch':''}</p>${x.question.steps.map(y=>`<div>${esc(y)}</div>`).join('')}<strong>Ergebnis: ${value(x.question)}</strong></div></details>`).join('')}</div></section>`;}
function emptyStats(){return `<div class="page-heading"><div class="eyebrow">DEIN LERNFORTSCHRITT</div><h1>Kleine Schritte. Sichtbare Erfolge.</h1><p>Hier findest du deine abgeschlossenen Runden.</p></div><div class="empty"><div class="empty-symbol">%</div><h2>Deine erste Runde wartet.</h2><p>Starte ein Training. Danach siehst du hier deine Punkte und welche Themen schon gut klappen.</p><a class="primary" href="#training">Zum Training ${svg('arrow')}</a></div>`;}
function summaryPage(){if(!state.rounds.length)return emptyStats();const s=E.summarize(state.rounds);return `${storageWarning()}<div class="page-heading"><div class="eyebrow">DEIN LERNFORTSCHRITT</div><h1>Das hast du schon geschafft.</h1><p>${state.rounds.length} abgeschlossene ${state.rounds.length===1?'Runde':'Runden'}. Jeder Schritt bringt dich weiter.</p></div>${statsHTML(s)}<section class="panel"><h2>Wie läuft es in den einzelnen Themen?</h2>${topicTable(s)}</section>${recommendation(s)}<section class="panel"><h2>Deine letzten Runden</h2>${state.rounds.slice(-8).reverse().map(r=>{const rs=E.summarize([r]);return `<div class="history-line"><div><strong>${topic(r.mode).name}</strong><p>${new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short'}).format(r.finishedAt)} · ${r.count} Aufgaben · ${rs.correct} richtig</p></div><a class="secondary" href="#ergebnis/${r.id}" aria-label="Runde vom ${new Date(r.finishedAt).toLocaleDateString('de-DE')} ansehen">${rs.points} / ${r.count*2} P. ${svg('arrow')}</a></div>`;}).join('')}</section><div class="reset-row"><p>Dein Lernstand wird nur in diesem Browser gespeichert.<br>Auf einem anderen Gerät beginnst du mit einem eigenen Lernstand.</p><button class="text-button" data-action="reset">Lernstand zurücksetzen</button></div>`;}
function helpPage(){return `<div class="page-heading"><div class="eyebrow">DEINE MERKHILFE</div><h1>Das Ganze. Der Teil. Der Anteil.</h1><p>Finde zuerst heraus, welcher Wert gesucht ist.</p></div><div class="help-grid"><article class="help-card"><div class="symbol">G</div><h2>Grundwert</h2><p>Das Ganze. Er entspricht immer 100 %.<br><strong>Beispiel:</strong> Eine Jacke kostet 80 €.</p><div class="formula">G = W : p · 100</div></article><article class="help-card"><div class="symbol">W</div><h2>Prozentwert</h2><p>Ein Teil des Ganzen.<br><strong>Beispiel:</strong> Der Rabatt beträgt 20 €.</p><div class="formula">W = G : 100 · p</div></article><article class="help-card"><div class="symbol">p %</div><h2>Prozentsatz</h2><p>Der Anteil in Prozent.<br><strong>Beispiel:</strong> Der Rabatt beträgt 25 %.</p><div class="formula">p = W : G · 100</div></article></div><div class="help-wide"><section class="panel"><span class="pill">− %</span><h2 style="margin-top:16px">Verminderter Grundwert</h2><p>Bei einem Rabatt wird der ursprüngliche Grundwert kleiner.<br><strong>Neuer Anteil = 100 % − p %</strong></p><div class="example"><strong>80 € mit 25 % Rabatt</strong>Neuer Preis: 80 : 100 · 75 = 60 €<br>Zurückrechnen: 60 : 75 · 100 = 80 €</div></section><section class="panel"><span class="pill">+ %</span><h2 style="margin-top:16px">Vermehrter Grundwert</h2><p>Bei einem Aufschlag wird der ursprüngliche Grundwert größer.<br><strong>Neuer Anteil = 100 % + p %</strong></p><div class="example"><strong>80 € mit 25 % Aufschlag</strong>Neuer Preis: 80 : 100 · 125 = 100 €<br>Zurückrechnen: 100 : 125 · 100 = 80 €</div></section></div><div class="tip-line"><strong>Achtung beim Zurückrechnen:</strong> Die Prozentangabe bezieht sich auf den ursprünglichen Grundwert. Ein Rabatt von 25 % wird nicht durch einen Aufschlag von 25 % rückgängig gemacht.</div><section class="panel"><h2>So sammelst du Punkte</h2><p style="font-size:13px;line-height:2"><strong>2 Punkte:</strong> sofort richtig, ohne Tipp.<br><strong>1 Punkt:</strong> mit Tipp oder im zweiten Versuch richtig.<br><strong>0 Punkte:</strong> nach zwei falschen Versuchen oder wenn du die Lösung ansiehst.<br>Ungültige Eingaben zählen nicht als Versuch. Du hast kein Zeitlimit.</p></section><div class="result-actions"><a class="primary" href="#training">Jetzt ausprobieren ${svg('arrow')}</a></div>`;}
function render(focus=false){let hash=location.hash.slice(1)||'training';const section=hash.split('/')[0];let html;
if(section==='runde'&&state.current)html=questionPage();else if(section==='auswertung')html=summaryPage();else if(section==='merkhilfe')html=helpPage();else if(section==='ergebnis')html=resultPage(hash.slice(9));else html=home();
document.getElementById('main').innerHTML=html;
const active=section==='auswertung'?'auswertung':section==='merkhilfe'?'merkhilfe':'training';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===active);if(a.dataset.nav===active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
if(focus){document.getElementById('main').focus({preventScroll:true});window.scrollTo(0,0);}
}
function openModal(title,message,onConfirm,confirmLabel='Bestätigen'){lastFocus=document.activeElement;modalCallback=onConfirm;const m=document.getElementById('modal');m.hidden=false;m.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message"><h2 id="modal-title">${esc(title)}</h2><p id="modal-message">${esc(message)}</p><div class="modal-actions"><button class="secondary" data-action="modal-cancel">Abbrechen</button><button class="primary" data-action="modal-confirm">${esc(confirmLabel)}</button></div></section>`;m.querySelector('button').focus();}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML='';modalCallback=null;lastFocus?.focus();}
function begin(mode=state.prefs.mode,count=state.prefs.count){const go=()=>{state.current=E.createRound(mode,count);inputError='';save();if(location.hash==='#runde')render(true);else location.hash='runde';};if(state.current)openModal('Eine neue Runde starten?','Die pausierte Runde wird ersetzt. Deine abgeschlossenen Runden bleiben erhalten.',go,'Neu starten');else go();}
function finishQuestion(correct,skipped=false,input=''){const r=state.current;if(!r||r.results[r.index])return;const q=r.questions[r.index];r.results.push({question:q,correct,skipped,input,attempts:r.attempts,hinted:r.hinted,points:E.score(correct,r.attempts,r.hinted)});inputError='';save();render();document.getElementById('next-btn')?.focus({preventScroll:true});}
function next(){const r=state.current;if(!r||!r.results[r.index])return;if(r.index+1===r.count){r.finishedAt=Date.now();if(!state.rounds.some(x=>x.id===r.id))state.rounds.push(r);state.current=null;save();location.hash='ergebnis/'+r.id;}else{r.index++;r.attempts=0;r.hinted=false;r.draft='';inputError='';save();render(true);}}
document.addEventListener('input',ev=>{if(ev.target.id==='answer'&&state.current){state.current.draft=ev.target.value;save();}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='answer-form')return;ev.preventDefault();const r=state.current;if(!r||r.results[r.index])return;const q=r.questions[r.index];const raw=document.getElementById('answer').value;r.draft=raw;const v=E.parseNumber(raw,q.unit);if(v===null){inputError='Gib eine Zahl ein, zum Beispiel 12,50. Tausender kannst du ohne Trennpunkt eingeben.';render();document.getElementById('answer').focus();return;}inputError='';if(E.isCorrect(v,q.answer))finishQuestion(true,false,raw);else if(r.attempts===0){r.attempts=1;save();render();const input=document.getElementById('answer');input.focus({preventScroll:true});input.select();}else finishQuestion(false,false,raw);});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='topic'){state.prefs.mode=b.dataset.topic;save();render();document.querySelector(`[data-topic="${b.dataset.topic}"]`)?.focus({preventScroll:true});}
if(a==='count'){state.prefs.count=Number(b.dataset.count);save();render();document.querySelector(`[data-count="${b.dataset.count}"]`)?.focus({preventScroll:true});}
if(a==='start')begin();
if(a==='again')begin(b.dataset.topic,Number(b.dataset.count));
if(a==='practice')begin(b.dataset.topic,10);
if(a==='pause'){save();location.hash='training';}
if(a==='hint'&&state.current&&!state.current.results[state.current.index]){state.current.hinted=true;save();render();document.querySelector('.hint-box')?.scrollIntoView({block:'nearest',behavior:'auto'});document.querySelector('[data-action="hint"]')?.focus({preventScroll:true});}
if(a==='skip'&&state.current&&!state.current.results[state.current.index])openModal('Den Rechenweg ansehen?','Du siehst die Lösung und bekommst für diese Aufgabe 0 Punkte. Danach kannst du weiterüben.',()=>finishQuestion(false,true,state.current.draft),'Lösung ansehen');
if(a==='next')next();
if(a==='reset')openModal('Lernstand zurücksetzen?','Alle Runden und Punkte in diesem Browser werden gelöscht. Das lässt sich nicht rückgängig machen.',()=>{state={rounds:[],current:null,prefs:{mode:'mix',count:10}};save();render(true);},'Zurücksetzen');
if(a==='modal-cancel')closeModal();
if(a==='modal-confirm'){const fn=modalCallback;closeModal();fn?.();}
});
document.addEventListener('keydown',ev=>{const m=document.getElementById('modal');if(m.hidden)return;if(ev.key==='Escape'){ev.preventDefault();closeModal();}if(ev.key==='Tab'){const bs=[...m.querySelectorAll('button')];if(ev.shiftKey&&document.activeElement===bs[0]){ev.preventDefault();bs[bs.length-1].focus();}else if(!ev.shiftKey&&document.activeElement===bs[bs.length-1]){ev.preventDefault();bs[0].focus();}}});
window.addEventListener('hashchange',()=>{inputError='';render(true);});
render();

</script>
</body>
</html>
